name: Importar notícias RSS

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  importar-noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar configuração do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure o segredo DATABASE_URL nas configurações do repositório."
            exit 1
          fi

      - name: Importar notícias dos feeds RSS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py buscar_noticias
